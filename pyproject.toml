[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "eweadn-x87"
dynamic = ["version"]
description = "Unofficial configurator for the EWEADN X87 keyboard on Linux"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Marcelo W.", email = "112717310+marcelowbr@users.noreply.github.com" }]
requires-python = ">=3.10"
# PyGObject, GTK 4 and libadwaita come from the system packages:
#   sudo apt install python3-gi gir1.2-gtk-4.0 gir1.2-adw-1
dependencies = []
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Hardware",
]

[project.urls]
Homepage = "https://github.com/marcelowbr/eweadn-x87"

[project.scripts]
eweadn-x87 = "eweadn_x87.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "eweadn_x87.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
